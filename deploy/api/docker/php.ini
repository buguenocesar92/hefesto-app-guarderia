; =============================================================================
; Configuración de PHP de Guardería
; =============================================================================

; Registro: los errores NO se muestran al navegador.
;
; En una aplicación con datos de menores y de salud, una excepción en pantalla
; puede incluir contenido de una petición. Un error de PHP puede imprimir el
; valor de una variable, y esa variable puede contener el nombre de un niño.
;
; En desarrollo se cambia a `On` SOLO en el `docker-compose.dev.yml`, y con
; `APP_DEBUG=false` para que Laravel no añada su propia traza.
display_errors = Off
display_startup_errors = Off

log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 60

; Una guardería no sube archivos por la interfaz: el límite es bajo a propósito.
; No hay fichas de salud en PDF ni consentimientos firmados adjuntos en esta
; versión, y no se abre la puerta a que se empiece a subir sin que nadie lo
; decida. Ver docs/06.
file_uploads = Off
upload_max_filesize = 4M
post_max_size = 4M

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; `validate_timestamps = 0` obliga a reiniciar el contenedor en cada despliegue.
; Es lo correcto en producción: una imagen con código viejo en caché es una
; imagen que sirve código viejo sin avisar.
;
; El compose de desarrollo lo sobrescribe con 1.
opcache.validate_timestamps = 0

date.timezone = America/Santiago

; La cookie de sesión.
session.cookie_httponly = 1

; `SameSite = Lax`: la cookie no viaja en peticiones iniciadas por otro sitio.
; La aplicación no tiene ninguna acción que necesite el modo `None`, y usarlo
; permitiría que un sitio de terceros mandara a alguien a esta interfaz con su
; sesión encima.
session.cookie_samesite = "Lax"

; --------------------------------------------------------------------------