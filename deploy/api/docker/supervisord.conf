; =============================================================================
; Supervisor de la API de Guardería
; =============================================================================
;
; DOS PROGRAMAS, UNO POR PROCESO
; ------------------------------
; PHP-FPM maneja las peticiones. Nginx las traduce. Si uno de los dos se para,
; el otro solo no sirve de nada, así que cada uno es un programa y cada uno se
; reinicia por separado.
;
; `autorestart=true` en los dos: un proceso que se cae vuelve a levantarse. Y
; `startsecs` dice cuántos segundos tiene que estar vivo para que se lo considere
; estable; si se muere antes, supervisor lo cuenta como fallo y reintenta con
; espera, en vez de entrar en un ciclo de reinicios rápidos.
;
; Ver docs/04.

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; -----------------------------------------------------------------------------
; PHP-FPM
; -----------------------------------------------------------------------------
[program:php]
command = php-fpm --nodaemonize
autostart = true
autorestart = true
startsecs = 5

; Si PHP-FPM se reinicia tres veces en menos de un minuto, supervisor lo deja
; quieto. Un proceso que entra en bucle no se arregla reiniciándolo más rápido,
; y el bucle tapa el error real.
startretries = 3

stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

priority = 10

; -----------------------------------------------------------------------------
; Nginx
; -----------------------------------------------------------------------------
[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
startsecs = 5
startretries = 3

stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

priority = 20