# =============================================================================
# Nginx de la API de Guardería
# =============================================================================
#
# POR QUÉ HAY NGINX ADELANTE DE PHP
# ---------------------------------
# PHP-FPM no habla HTTP por sí solo: habla un protocolo de proceso a proceso. Alguien tiene que traducir.
#
# Y ese "alguien" no puede ser el proxy público de la instalación, porque en producción
# SÓLO EL PROXY PUBLICA PUERTOS. Ver `deploy/docker-compose.prod.yml`.

# -----------------------------------------------------------------------------
# Global
# -----------------------------------------------------------------------------

user hefesto;
worker_processes auto;
pid /run/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Los registros van a la salida estándar: el orquestador los recoge de ahí.
    # Un archivo de log dentro del contenedor se pierde cuando el contenedor se
    # recrea, y en esta aplicación eso significa perder el registro de quién
    # abrió una ficha de un menor.
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # En una aplicación con datos de menores, el tamaño de una petición se
    # limita desde el servidor. El límite de cuatro megas es el de `php.ini`,
    # y los dos tienen que decir lo mismo.
    client_max_body_size 4m;

    # La cabecera `Server` no dice nada útil y sí dice qué versión hay
    # instalada.
    server_tokens off;

    gzip on;
    gzip_types application/json text/css text/javascript;
    gzip_min_length 1024;

    server {
        listen 8000;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Las rutas que no existen en el código se resuelven hacia index.php.
        # Es el comportamiento que espera Laravel con `/api/...` en
        # `routes/web.php`.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # -----------------------------------------------------------------------------
        # La salud del servicio
        # -----------------------------------------------------------------------------
        #
        # Una ruta que devuelve 200 sin tocar la base. La usa el HEALTHCHECK del
        # Dockerfile para decidir si hay que reiniciar el contenedor.
        #
        # Lo que NO comprueba: que la base responda. Un healthcheck que consulta
        # la base pone el contenedor en unhealthy cada vez que PostgreSQL se
        # reinicia, y el orquestador lo reinicia en cascada.
        location = /api/v1/salud {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"estado":"ok","servicio":"api-guarderia"}';
        }

        # -----------------------------------------------------------------------------
        # Todo lo demás va por PHP
        # -----------------------------------------------------------------------------
        location ~ \.php$ {
            include fastcgi_params;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            # La cabecera `Host` tiene que llegar: el emisor de Authentik se
            # compara contra la URL de retorno, y sin el host la comparación
            # falla con un error que no dice nada útil.
            fastcgi_param HTTP_HOST $host;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Tiempos largos. Un respaldo o una migración pueden tardar más que
            # los treinta segundos de omisión, y un corte de conexión a mitad de
            # una migración deja la base en un estado que alguien tiene que
            # reparar a mano.
            fastcgi_read_timeout 120;
            fastcgi_send_timeout 120;

            # La interfaz no envía archivos: el límite es bajo a propósito.
            client_max_body_size 4m;
        }

        # Un archivo que existe en el disco pero no debería servirse nunca.
        location ~ /\. {
            deny all;
        }

        # Lo que no es PHP ni un archivo estático: 404, no la interfaz.
        location ~ ^/(storage|bootstrap/cache|vendor|app|database|tests|deploy)/ {
            deny all;
        }
    }
}